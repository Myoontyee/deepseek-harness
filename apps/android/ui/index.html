<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><title>DeepSeek Harness Desktop</title></head><body>
<button id="drawerBackdrop" aria-label="收起对话记录" hidden></button>
<aside id="drawer" aria-label="对话记录" hidden>
<div class="sidebar-heading"><strong>DeepSeek Harness Desktop</strong><button id="closeHistory" class="icon-button" aria-label="关闭对话记录" data-icon="close"></button></div>
<button id="sidebarNew" class="navigation"><span data-icon="new"></span>新对话</button>
<div class="history-scroll"><div class="section-label">手机对话</div><div id="chats"></div><div class="section-label" id="remoteLabel" hidden>已连接的电脑</div><div id="remoteChats"></div></div>
<div class="sidebar-footer"><button id="refreshRemote" class="navigation quiet"><span data-icon="refresh"></span>刷新远程对话</button><button id="delete" class="navigation quiet">删除当前手机对话</button><button id="settings" class="navigation"><span data-icon="settings"></span>设置</button></div>
</aside>
<div class="conversation">
<header><button id="history" class="icon-button" aria-label="对话记录" aria-expanded="false" aria-controls="drawer" data-icon="sidebar"></button><div class="title-cluster"><strong id="title">新对话</strong><span class="view-label">对话</span></div><button id="new" class="icon-button" aria-label="新对话" data-icon="new"></button></header>
<div id="notice" role="status" hidden></div><main id="messages" aria-label="对话内容"></main>
<button id="selection" hidden>添加注释</button>
<footer><div class="composer"><div id="notes"></div><textarea id="input" rows="2" placeholder="发消息，或选中文字添加注释…" aria-label="消息"></textarea><div class="composer-toolbar"><div class="model-controls"><select id="model" aria-label="回答模型"><option value="">读取账号模型…</option></select><select id="effort" aria-label="思考强度"><option value="off">不思考</option><option value="low">低</option><option value="high" selected>高</option><option value="max">最高</option></select><button id="refreshModels" class="icon-button" aria-label="刷新模型" data-icon="refresh"></button></div><button id="stop" class="icon-button primary" aria-label="停止生成" data-icon="stop" hidden></button><button id="send" class="icon-button primary" aria-label="发送" data-icon="send"></button></div></div><small id="saving">对话与草稿保存在本机</small></footer>
</div>
<dialog id="annotation" aria-labelledby="annotationTitle"><form method="dialog"><strong id="annotationTitle">添加注释</strong><div id="quote" class="markdown" aria-label="所选文本"></div><textarea id="comment" rows="4" placeholder="补充评论（可选）" aria-label="批注评论"></textarea><small class="draft-hint">草稿自动暂存</small><div class="annotation-actions"><button id="cancelNote" type="button">取消 <kbd>Esc</kbd></button><button id="saveNote" type="button" class="primary">添加注释 <kbd>Ctrl+Enter</kbd></button></div></form></dialog>
<script type="module" src="./main.ts"></script></body></html>
