<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><title>DeepSeek Harness Desktop</title></head><body>
<header><button id="history" aria-label="对话记录">☰</button><strong>DeepSeek Harness Desktop</strong><button id="new" aria-label="新对话">＋</button><button id="settings" aria-label="设置">⚙</button></header>
<aside id="drawer" hidden><div class="row"><strong>对话</strong><button id="closeHistory">关闭</button></div><div id="chats"></div><div id="remoteChats"></div><button id="refreshRemote">刷新远程对话</button><button id="delete">删除当前手机对话</button></aside>
<div id="notice" role="status" hidden></div><main id="messages"></main>
<button id="selection" hidden>添加注释</button>
<footer><div id="notes"></div><div class="row"><select id="model" aria-label="回答模型"><option value="">读取账号模型…</option></select><button id="refreshModels" aria-label="刷新模型">↻</button><select id="effort" aria-label="思考强度"><option value="off">不思考</option><option value="low">低</option><option value="high" selected>高</option><option value="max">最高</option></select></div><textarea id="input" rows="2" placeholder="向 DeepSeek 发消息，也可以选中文字添加批注" aria-label="消息"></textarea><div class="row actions"><small id="saving">对话与草稿保存在本机</small><button id="stop" hidden>停止</button><button id="send" class="primary">发送</button></div></footer>
<dialog id="annotation"><form method="dialog"><strong>添加注释</strong><div id="quote"></div><textarea id="comment" rows="4" placeholder="补充评论（可选）" aria-label="批注评论"></textarea><div class="row actions"><small>草稿自动暂存</small><button id="cancelNote" type="button">取消 Esc</button><button id="saveNote" type="button" class="primary">保存 Ctrl+Enter</button></div></form></dialog>
<script type="module" src="./main.ts"></script></body></html>
