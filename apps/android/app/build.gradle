plugins { id 'com.android.application' }
android {
 namespace 'io.jadegate.dsh.companion'
 compileSdk 35
 buildFeatures { buildConfig true }
 packagingOptions { jniLibs { useLegacyPackaging true } }
 defaultConfig {
  applicationId = 'io.jadegate.dsh.companion'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  minSdk = 26
  targetSdk = 35
  versionCode = (System.getenv('DSH_ANDROID_VERSION_CODE') ?: '2026101805').toInteger()
  versionName = System.getenv('DSH_ANDROID_VERSION_NAME') ?: '0.2.1-rc.2.20261018.5'
  buildConfigField 'String', 'HARNESS_VERSION', '"' + new groovy.json.JsonSlurper().parse(file('../../../package.json')).version + '"'
 }
 if (System.getenv('DSH_ANDROID_KEYSTORE')) {
  signingConfigs { release { storeFile file(System.getenv('DSH_ANDROID_KEYSTORE')); storePassword System.getenv('DSH_ANDROID_STORE_PASSWORD'); keyAlias 'dsh-companion'; keyPassword System.getenv('DSH_ANDROID_STORE_PASSWORD') } }
 }
 buildTypes { release { if (System.getenv('DSH_ANDROID_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation 'androidx.webkit:webkit:1.12.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}


// Keep callback proof checks in every APK build without introducing a test dependency.
tasks.register('compileAccountProof', JavaCompile) {
 source files('src/main/java/io/jadegate/dsh/companion/AccountProof.java', '../tests/AccountProofCheck.java')
 classpath = files()
 destinationDirectory = layout.buildDirectory.dir('account-proof')
 options.encoding = 'UTF-8'
 sourceCompatibility = '17'
 targetCompatibility = '17'
}
tasks.register('verifyAccountProof', JavaExec) {
 dependsOn tasks.named('compileAccountProof')
 classpath = files(layout.buildDirectory.dir('account-proof'))
 mainClass = 'io.jadegate.dsh.companion.AccountProofCheck'
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyAccountProof') }

tasks.register('compileNetworkEvidence', JavaCompile) {
 source files('src/main/java/io/jadegate/dsh/companion/NetworkEvidence.java', '../tests/NetworkEvidenceCheck.java')
 classpath = files()
 destinationDirectory = layout.buildDirectory.dir('network-evidence')
 options.encoding = 'UTF-8'
 sourceCompatibility = '17'
 targetCompatibility = '17'
}
tasks.register('verifyNetworkEvidence', JavaExec) {
 dependsOn tasks.named('compileNetworkEvidence')
 classpath = files(layout.buildDirectory.dir('network-evidence'))
 mainClass = 'io.jadegate.dsh.companion.NetworkEvidenceCheck'
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyNetworkEvidence') }
