plugins { id 'com.android.application' }
android {
 namespace 'io.jadegate.dsh.companion'
 compileSdk 35
 defaultConfig { applicationId 'io.jadegate.dsh.companion'; minSdk 26; targetSdk 35; versionCode 2026100803; versionName '0.2.1-alpha.1.20261008.3' }
 signingConfigs { release { if (System.getenv('DSH_ANDROID_KEYSTORE')) storeFile file(System.getenv('DSH_ANDROID_KEYSTORE')); storePassword System.getenv('DSH_ANDROID_STORE_PASSWORD'); keyAlias 'dsh-companion'; keyPassword System.getenv('DSH_ANDROID_STORE_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
