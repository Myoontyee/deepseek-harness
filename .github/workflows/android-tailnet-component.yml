name: Android embedded Tailscale component
on:
  push:
    branches: [codex/android-tailnet-20261018]
    paths: ['apps/android/**', '.github/workflows/android-tailnet-component.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-tailnet-component
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Resolve pinned Tailscale dependency
        working-directory: apps/android/tailnet
        run: |
          go mod tidy
          go test ./...
      - name: Build Android native helpers
        working-directory: apps/android/tailnet
        shell: bash
        run: |
          set -euo pipefail
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          for target in arm64-v8a x86_64; do
            if [ "$target" = arm64-v8a ]; then arch=arm64; cc=aarch64-linux-android26-clang; else arch=amd64; cc=x86_64-linux-android26-clang; fi
            mkdir -p "out/$target"
            GOOS=android GOARCH=$arch CGO_ENABLED=1 CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/$cc" go build -trimpath -buildmode=pie -tags osusergo -ldflags '-s -w -extldflags=-Wl,-z,max-page-size=16384' -o "out/$target/libdsh_tailnet.so" .
          done
          cp go.mod go.sum out/
          cp "$(go env GOMODCACHE)/tailscale.com@v1.104.1/LICENSE" out/Tailscale-LICENSE.txt
          go list -m all > out/dependencies.txt
          sha256sum out/*/*.so > out/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: android-tailnet-component
          path: apps/android/tailnet/out/
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build phone chat assets
        run: |
          pnpm install --frozen-lockfile
          node apps/android/ui/build.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned Android app
        env:
          DSH_ANDROID_VERSION_NAME: 0.2.1-rc.2.20261018.5
          DSH_ANDROID_VERSION_CODE: '2026101805'
        run: |
          mkdir -p apps/android/app/src/main/jniLibs apps/android/app/src/main/assets/licenses
          cp -r apps/android/tailnet/out/arm64-v8a apps/android/tailnet/out/x86_64 apps/android/app/src/main/jniLibs/
          cp apps/android/tailnet/out/Tailscale-LICENSE.txt apps/android/app/src/main/assets/licenses/
          gradle --no-daemon --max-workers=2 -p apps/android :app:testReleaseUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon --max-workers=2 -p apps/android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-device-test-results
          path: apps/android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v6
        with:
          name: android-tailnet-unsigned-apk
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
